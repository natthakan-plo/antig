<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Grid lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Glow orb -->
  <circle cx="200" cy="180" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="650" cy="280" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- App Header Bar -->
  <rect x="50" y="35" width="700" height="40" rx="8" fill="#1e293b" opacity="0.95" stroke="#334155" stroke-width="1" />
  <circle cx="75" cy="55" r="5" fill="#ef4444" />
  <circle cx="95" cy="55" r="5" fill="#eab308" />
  <circle cx="115" cy="55" r="5" fill="#22c55e" />
  <text x="145" y="60" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Sports Equipment Borrow-Return Management System</text>
  <rect x="620" y="44" width="110" height="22" rx="4" fill="#06b6d4" opacity="0.2" />
  <text x="635" y="59" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">v2.4 Active</text>

  <!-- Left: Database ER Diagram Mockup -->
  <rect x="50" y="95" width="310" height="315" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
  <rect x="50" y="95" width="310" height="38" rx="12" fill="#06b6d4" fill-opacity="0.15" />
  <text x="70" y="120" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">ENTITY RELATIONSHIP DIAGRAM</text>
  
  <!-- Entity Table 1: Equipment -->
  <rect x="70" y="145" width="125" height="100" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <rect x="70" y="145" width="125" height="22" rx="6" fill="#334155" />
  <text x="80" y="160" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">EQUIPMENT</text>
  <text x="80" y="180" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="9">PK  equip_id</text>
  <text x="80" y="198" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9">     name, category</text>
  <text x="80" y="216" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9">     qty_total, status</text>
  <text x="80" y="234" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9">     storage_location</text>

  <!-- Entity Table 2: User -->
  <rect x="220" y="145" width="120" height="100" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <rect x="220" y="145" width="120" height="22" rx="6" fill="#334155" />
  <text x="230" y="160" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">STUDENT_USER</text>
  <text x="230" y="180" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="9">PK  student_id</text>
  <text x="230" y="198" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9">     full_name</text>
  <text x="230" y="216" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9">     dept, contact</text>
  <text x="230" y="234" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9">     card_rfid</text>

  <!-- Entity Table 3: Borrow Record -->
  <rect x="135" y="275" width="145" height="115" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
  <rect x="135" y="275" width="145" height="22" rx="6" fill="#4338ca" />
  <text x="145" y="290" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">BORROW_TRANSACTION</text>
  <text x="145" y="310" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="9">PK  transaction_id</text>
  <text x="145" y="328" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="9">FK  equip_id</text>
  <text x="145" y="346" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="9">FK  student_id</text>
  <text x="145" y="364" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9">     borrow_date, due</text>
  <text x="145" y="380" fill="#22c55e" font-family="'Segoe UI', sans-serif" font-size="9">     return_status</text>

  <!-- ER Relation lines -->
  <path d="M 132 245 L 132 260 L 165 260 L 165 275" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
  <path d="M 280 245 L 280 260 L 250 260 L 250 275" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Right: Dashboard Stats & UI Cards -->
  <rect x="380" y="95" width="370" height="90" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
  <text x="400" y="122" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">OVERVIEW STATISTICS</text>
  
  <rect x="400" y="132" width="100" height="42" rx="6" fill="#1e293b" />
  <text x="412" y="152" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">142</text>
  <text x="412" y="166" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9">อุปกรณ์ทั้งหมด</text>

  <rect x="515" y="132" width="105" height="42" rx="6" fill="#1e293b" />
  <text x="527" y="152" fill="#22c55e" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">38 รายการ</text>
  <text x="527" y="166" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9">กำลังยืมใช้งาน</text>

  <rect x="635" y="132" width="95" height="42" rx="6" fill="#1e293b" />
  <text x="647" y="152" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">0 ค้างส่ง</text>
  <text x="647" y="166" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9">เกินกำหนด</text>

  <!-- Interactive Equipment List UI -->
  <rect x="380" y="200" width="370" height="210" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
  <text x="400" y="225" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">รายการอุปกรณ์กีฬาและการยืม–คืน</text>

  <!-- Item Row 1 -->
  <rect x="400" y="240" width="330" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="420" cy="260" r="10" fill="#0284c7" />
  <text x="416" y="264" fill="#ffffff" font-size="12">⚽</text>
  <text x="440" y="258" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">ลูกฟุตบอลแข่งขัน Molten F5V</text>
  <text x="440" y="272" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">รหัส: SP-FB-012 | ยืมโดย: ณัฐกานต์ ป.</text>
  <rect x="655" y="249" width="65" height="22" rx="11" fill="#22c55e" fill-opacity="0.2" />
  <text x="668" y="264" fill="#4ade80" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">คืนแล้ว</text>

  <!-- Item Row 2 -->
  <rect x="400" y="290" width="330" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="420" cy="310" r="10" fill="#ea580c" />
  <text x="416" y="314" fill="#ffffff" font-size="12">🏀</text>
  <text x="440" y="308" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">ลูกบาสเกตบอล Spalding TF-250</text>
  <text x="440" y="322" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">รหัส: SP-BB-008 | ยืมโดย: กิตติศักดิ์ ว.</text>
  <rect x="655" y="299" width="65" height="22" rx="11" fill="#06b6d4" fill-opacity="0.2" />
  <text x="668" y="314" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">กำลังยืม</text>

  <!-- Item Row 3 -->
  <rect x="400" y="340" width="330" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="420" cy="360" r="10" fill="#7c3aed" />
  <text x="416" y="364" fill="#ffffff" font-size="12">🏸</text>
  <text x="440" y="358" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">ไม้แบดมินตัน Yonex พร้อมลูกขนไก่</text>
  <text x="440" y="372" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">รหัส: SP-BM-044 | ยืมโดย: พิชชาพร ส.</text>
  <rect x="655" y="349" width="65" height="22" rx="11" fill="#22c55e" fill-opacity="0.2" />
  <text x="668" y="364" fill="#4ade80" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">คืนแล้ว</text>
</svg>
