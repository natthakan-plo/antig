<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="candleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18131b" />
      <stop offset="50%" stop-color="#241a24" />
      <stop offset="100%" stop-color="#140f1a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e2233" />
      <stop offset="100%" stop-color="#1c1622" />
    </linearGradient>
    <filter id="warmGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#candleBg)" />

  <!-- Ambient warm glow -->
  <circle cx="260" cy="220" r="160" fill="#f59e0b" opacity="0.1" filter="url(#warmGlow)" />
  <circle cx="600" cy="180" r="140" fill="#ec4899" opacity="0.08" filter="url(#warmGlow)" />

  <!-- Browser window mockup -->
  <rect x="40" y="30" width="720" height="390" rx="14" fill="#1b1522" stroke="#3b2d44" stroke-width="1.5" />
  
  <!-- Browser Header -->
  <rect x="40" y="30" width="720" height="42" rx="14" fill="#251c2f" />
  <circle cx="65" cy="51" r="5" fill="#f43f5e" />
  <circle cx="83" cy="51" r="5" fill="#f59e0b" />
  <circle cx="101" cy="51" r="5" fill="#10b981" />
  <rect x="135" y="40" width="400" height="22" rx="6" fill="#181220" />
  <text x="150" y="55" fill="#9d8ba9" font-family="'Segoe UI', sans-serif" font-size="11">https://candleshop-boutique.store/collection/organic-aroma</text>
  <rect x="665" y="39" width="75" height="24" rx="6" fill="#f59e0b" fill-opacity="0.2" />
  <text x="677" y="55" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Cart (3)</text>

  <!-- Store Navigation -->
  <rect x="65" y="85" width="670" height="35" rx="8" fill="#241a2c" />
  <text x="85" y="107" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">🕯️ LUMIÈRE CANDLES</text>
  <text x="270" y="106" fill="#f3e8ff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Home</text>
  <text x="330" y="106" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Collection</text>
  <text x="410" y="106" fill="#c4b5fd" font-family="'Segoe UI', sans-serif" font-size="11">Scent Quiz</text>
  <text x="490" y="106" fill="#c4b5fd" font-family="'Segoe UI', sans-serif" font-size="11">About Us</text>
  <text x="560" y="106" fill="#c4b5fd" font-family="'Segoe UI', sans-serif" font-size="11">Contact</text>

  <!-- Left: Featured Product Hero Showcase -->
  <rect x="65" y="135" width="370" height="260" rx="12" fill="url(#cardGlow)" stroke="#583c66" stroke-width="1" />
  <rect x="85" y="150" width="140" height="150" rx="10" fill="#17111e" stroke="#483254" stroke-width="1" />
  
  <!-- Candle Graphic Illustration -->
  <rect x="130" y="195" width="50" height="85" rx="5" fill="#fef3c7" />
  <rect x="135" y="225" width="40" height="40" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1" />
  <text x="140" y="248" fill="#78350f" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold">VANILLA</text>
  <line x1="155" y1="195" x2="155" y2="182" stroke="#451a03" stroke-width="2" />
  <!-- Flame -->
  <path d="M 155 180 Q 150 172 155 165 Q 160 172 155 180 Z" fill="url(#goldGrad)" filter="url(#warmGlow)" />

  <text x="240" y="175" fill="#fef08a" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">Midnight Amber & Vanilla</text>
  <text x="240" y="195" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10">เทียนหอมไขถั่วเหลืองธรรมชาติ 100%</text>
  <text x="240" y="210" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">กลิ่นหอมอบอุ่น ผ่อนคลาย สร้างบรรยากาศโรแมนติก</text>
  
  <text x="240" y="235" fill="#fbbf24" font-size="12">★★★★★</text>
  <text x="295" y="235" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">(128 reviews)</text>

  <text x="240" y="265" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold">฿490</text>
  <text x="295" y="265" fill="#6b7280" font-family="'Segoe UI', sans-serif" font-size="12" text-decoration="line-through">฿650</text>
  <rect x="340" y="250" width="55" height="18" rx="4" fill="#ef4444" fill-opacity="0.3" />
  <text x="348" y="263" fill="#f87171" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">-25% OFF</text>

  <!-- Add to Cart Button -->
  <rect x="85" y="320" width="330" height="42" rx="8" fill="url(#goldGrad)" />
  <text x="180" y="346" fill="#1e1302" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">🛒 เพิ่มลงในตะกร้าสินค้า (Add to Cart)</text>

  <!-- Right: Mobile Responsive Preview & Checkout Flow -->
  <rect x="455" y="135" width="280" height="260" rx="12" fill="url(#cardGlow)" stroke="#583c66" stroke-width="1" />
  <text x="475" y="160" fill="#f3e8ff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">📱 Responsive Mobile & Checkout Flow</text>

  <!-- Mobile phone mockup -->
  <rect x="475" y="175" width="115" height="205" rx="14" fill="#0d0912" stroke="#7c3aed" stroke-width="1.5" />
  <rect x="510" y="180" width="45" height="6" rx="3" fill="#3b2d44" />
  <rect x="483" y="195" width="99" height="40" rx="4" fill="#2b1a38" />
  <text x="488" y="212" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold">Candle Shop</text>
  <text x="488" y="224" fill="#e9d5ff" font-family="'Segoe UI', sans-serif" font-size="6">One-Page Checkout</text>

  <rect x="483" y="242" width="99" height="75" rx="4" fill="#1b1224" />
  <text x="488" y="255" fill="#c4b5fd" font-family="'Segoe UI', sans-serif" font-size="7">สรุปคำสั่งซื้อ: 2 ชิ้น</text>
  <text x="488" y="268" fill="#fef08a" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold">ยอดรวม: ฿980</text>
  <rect x="488" y="276" width="89" height="15" rx="3" fill="#22c55e" />
  <text x="502" y="287" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="bold">PromptPay Scan</text>

  <!-- Checkout Features List -->
  <rect x="605" y="180" width="115" height="42" rx="6" fill="#22162c" />
  <text x="615" y="196" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold">Figma Prototyping</text>
  <text x="615" y="210" fill="#a78bfa" font-family="'Segoe UI', sans-serif" font-size="7">Design System ครบชุด</text>

  <rect x="605" y="232" width="115" height="42" rx="6" fill="#22162c" />
  <text x="615" y="248" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold">UX/UI Flow</text>
  <text x="615" y="262" fill="#a78bfa" font-family="'Segoe UI', sans-serif" font-size="7">ลด Step การชำระเงิน</text>

  <rect x="605" y="284" width="115" height="42" rx="6" fill="#22162c" />
  <text x="615" y="300" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold">100% Responsive</text>
  <text x="615" y="314" fill="#a78bfa" font-family="'Segoe UI', sans-serif" font-size="7">Desktop, Tablet, Mobile</text>
</svg>
