<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1a2538" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="560" fill="url(#certBg4)" />

  <!-- Borders -->
  <rect x="25" y="25" width="750" height="510" rx="12" fill="none" stroke="url(#emeraldGold)" stroke-width="3" />
  <rect x="35" y="35" width="730" height="490" rx="8" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="8,4" />
  <rect x="42" y="42" width="716" height="476" rx="6" fill="#111827" fill-opacity="0.7" stroke="url(#emeraldGold)" stroke-width="1" />

  <!-- Corner Ornaments -->
  <g fill="url(#emeraldGold)">
    <polygon points="25,25 65,25 25,65" />
    <polygon points="775,25 735,25 775,65" />
    <polygon points="25,535 65,535 25,495" />
    <polygon points="775,535 735,535 775,495" />
  </g>

  <!-- Top Seal / Academic Medallion -->
  <circle cx="400" cy="100" r="36" fill="#064e3b" stroke="url(#emeraldGold)" stroke-width="2.5" filter="url(#emeraldGlow)" />
  <circle cx="400" cy="100" r="28" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="3,2" />
  <text x="384" y="112" font-size="30">🌟</text>

  <!-- Title -->
  <text x="400" y="165" text-anchor="middle" fill="#cbd5e1" font-family="'Prompt', sans-serif" font-size="14" letter-spacing="3">สำนักงานคณะกรรมการการอาชีวศึกษา</text>
  <text x="400" y="200" text-anchor="middle" fill="url(#emeraldGold)" font-family="'Prompt', sans-serif" font-size="22" font-weight="bold">เกียรติบัตรเชิดชูเกียรติ</text>
  <line x1="280" y1="215" x2="520" y2="215" stroke="url(#emeraldGold)" stroke-width="1.5" />

  <!-- Content -->
  <text x="400" y="255" text-anchor="middle" fill="#e2e8f0" font-family="'Prompt', sans-serif" font-size="16">เกียรติบัตรฉบับนี้มอบให้แก่</text>
  <text x="400" y="300" text-anchor="middle" fill="#fef08a" font-family="'Prompt', sans-serif" font-size="26" font-weight="bold">นางสาวณัฐกานต์ ปลอดโยธา</text>
  
  <text x="400" y="345" text-anchor="middle" fill="#cbd5e1" font-family="'Prompt', sans-serif" font-size="16">ได้รับเกียรติบัตรจากโครงการ</text>
  <text x="400" y="380" text-anchor="middle" fill="#34d399" font-family="'Prompt', sans-serif" font-size="20" font-weight="bold">“เด็กดี ศรีอาชีวะ” ประเภทเรียนดี</text>
  <text x="400" y="410" text-anchor="middle" fill="#a7f3d0" font-family="'Prompt', sans-serif" font-size="15">ประจำปีการศึกษา 2567</text>

  <!-- Ribbon Seal Bottom Left -->
  <g transform="translate(110, 430)">
    <circle cx="35" cy="35" r="32" fill="#064e3b" stroke="url(#emeraldGold)" stroke-width="2" />
    <text x="18" y="40" fill="#a7f3d0" font-family="'Prompt', sans-serif" font-size="10" font-weight="bold">EXCELLENCE</text>
    <path d="M 20 62 L 10 95 L 35 80 L 60 95 L 50 62 Z" fill="url(#emeraldGold)" />
  </g>

  <!-- Signature Bottom Right -->
  <g transform="translate(530, 420)">
    <line x1="20" y1="55" x2="200" y2="55" stroke="#94a3b8" stroke-width="1" />
    <path d="M 40 50 Q 80 20 110 50 T 170 45" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8" />
    <text x="110" y="75" text-anchor="middle" fill="#94a3b8" font-family="'Prompt', sans-serif" font-size="12">ประธานคณะกรรมการโครงการ</text>
  </g>
</svg>
